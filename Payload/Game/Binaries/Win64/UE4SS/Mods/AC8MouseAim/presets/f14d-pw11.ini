[control]
; Prefer the PW mouse flight target when switching targets with any weapon.
; 0=stock selection (default), 1=mouse target priority. F10 reloads.
; Keeps native weapon eligibility/lock rules and short-release timing; free look stays stock.
mouse_target_priority=1
; LOCAL FORK 0.2.30-pw.11 (upstream 0.2.30). Restart game after changing [keys].
; Existing F-14D personal settings retained; original pw.5 release preserved.
; New mode: angle error drives input; measured rotation predicts braking.
; 1=angle control (default), 0=unchanged pw.5 rate control. F10 reloads.
angle_control=1
; Angle mode: separate rollout target and supplement fast arrival braking.
; 0=exact pw.7 behavior, 1=new arrival control. F10 reloads with neutral reset.
rollout_coordination=1
; Degrees for full input before braking/axis coordination (5..90 / 10..120).
pitch_full_input_angle=20.0
roll_full_input_angle=45.0
; Prediction seconds, 0..0.6; 0 disables rate braking on the corresponding axes.
turn_brake_lookahead=0.10
roll_brake_lookahead=0.25
; Estimated relative pitch/yaw authority, NOT a maximum angular rate (1..30).
angle_pitch_yaw_ratio=5.5
angle_high_g_pitch_yaw_ratio=11.0
; ANGLE MODE ONLY: gentle roll below 8 degrees of aim error, aggressive above 30.
; Existing bank (25..60 degrees) also keeps an ongoing large turn responsive.
; Proportional input scales (0.2..1 / 1..2); braking is tuned separately.
roll_small_input_scale=0.50
roll_large_input_scale=1.35
; Small-correction bank cap (10..89), never greater than max_bank.
roll_small_bank=25.0
; Multiplier on roll_brake_lookahead's rate damping (1..3).
roll_brake_gain=1.50
; High-G arrival prediction seconds (0..0.6), at least normal turn lookahead.
; Fades in with remaining angle and measured rotation, no fixed rate ceiling.
high_g_brake_lookahead=0.30
; Reverse pitch gain (1..3); no extra gain on forward pulling.
; After fast rotation stops near the target, use gentler final pitch correction.
high_g_brake_gain=1.50
; Fade braking after chord release (0..1 seconds); DOES NOT hold game keys.
high_g_brake_hold=0.45
; Free distant pitch from joint yaw limits (0..1), only while bank is aligned.
; Fades for height corrections, arrival and inversion; 0 disables this relief.
high_g_pitch_priority=1.0
; Legacy gains/damping/smoothing/FOV/dead_zone remain compatibility placeholders.
; Mouse counts to world-space target angle, in degrees.
sensitivity=0.10

; Legacy placeholders below; do not tune these to fix rolling.
roll_gain=0.022
pitch_gain=0.026
yaw_gain=0.012
turn_pull=0.42
; Effective normal target-bank limit (degrees, 20..89); actual bank can overshoot.
max_bank=89.0
; LEGACY ONLY: rate scales/gains below apply only when angle_control=0.
; Normal/near-vertical turn rate and input authority, relative to pw.2 (0.7..1.4).
turn_rate_scale=1.20
; Normal roll rate/stopping envelope scale (0.7..1.4), fades on final leveling.
roll_rate_scale=1.35
; Rate tracking feedback (0.8..1.6); active reverse/braking feedback (1..3).
response_gain=1.20
countersteer_gain=2.0
; BOTH MODES: predict approaching bank for turn release (0..0.15 seconds).
roll_lookahead=0.12
; Observe the player's actual high-G key chord; do not synthesize throttle inputs.
high_g_enabled=1
; LEGACY ONLY: requested pitch-rate ceiling while the chord is held.
; Degrees/second, 54..140. This is NOT an edit to the aircraft flight model.
high_g_pitch_rate=110.0
; Hold the chosen turn side near the rear heading seam (0 disables).
rear_turn_hold=1
; LEGACY ONLY: up to full pitch input for distant non-high-G dive targets.
dive_pitch_boost=1
; LEGACY ONLY: extra yaw in large, aligned, near-level high-G turns.
; Enabled in this user preset; original pw.5 default is 0. F10 reloads.
high_g_yaw_boost=1
; Local fork: normal target-bank limit above is now effective.
allow_dive_inversion=1
dive_enter_pitch=-45.0
dive_enter_delta=25.0
dive_exit_pitch=-30.0
; 1: up to 20 Hz guidance diagnostics; 0: one sample per 10 seconds.
diagnostics=1
smoothing=0.12

; Legacy damping/dead-zone placeholders (not used by the rate controller).
roll_damping=0.008
pitch_damping=0.010
yaw_damping=0.30
dead_zone=1.25

; Flip one sign if that axis moves opposite to the target marker.
pitch_sign=1
roll_sign=-1
yaw_sign=-1

; Legacy FOV placeholders; live game camera FOV is used instead.
horizontal_fov=100.0
vertical_fov=62.0

; Build 25201480 input layout: slot 1 is yaw.
pitch_slot=0
roll_slot=2

; Keyboard names are case-insensitive. Restart GAME after editing this section.
; Flight pairs only detect manual takeover: bind the same keys in the GAME.
[keys]
pitch_keys=W,S
roll_keys=A,D
yaw_keys=Q,E
free_look=F
toggle_hud=F7
toggle_enabled=F8
recenter=F9
reload_config=F10
gaze_probe=F6
perf_report=F5
; Both keys must be held together. Match the game's accelerate/decelerate keys.
high_g_keys=CTRL,SPACE
