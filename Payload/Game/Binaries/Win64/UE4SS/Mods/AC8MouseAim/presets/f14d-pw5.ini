[control]
; LOCAL FORK 0.2.30-pw.5 (upstream 0.2.30). Restart game after changing [keys].
; F-14D user preset pw.5-f14d-preset.1, captured 2026-10-04.
; PW-style mouse handling, tuned on F-14D; adjust for your aircraft/preferences.
; Optional preset; see docs/PW5.md. Copy to the mod's config.ini to apply.
; Legacy gains/damping/smoothing/FOV/dead_zone remain compatibility placeholders.
; Mouse counts to world-space target angle, in degrees.
sensitivity=0.10

; Legacy placeholders below; do not tune these to fix rolling.
roll_gain=0.022
pitch_gain=0.026
yaw_gain=0.012
turn_pull=0.42
; Effective normal target-bank limit (degrees, 20..89); actual bank can overshoot.
max_bank=89.0
; pw.3 response tuning. F10 reloads these; input axes remain bounded to [-1,1].
; Normal/near-vertical turn rate and input authority, relative to pw.2 (0.7..1.4).
turn_rate_scale=1.20
; Normal roll rate/stopping envelope scale (0.7..1.4), fades on final leveling.
roll_rate_scale=1.35
; Rate tracking feedback (0.8..1.6); active reverse/braking feedback (1..3).
response_gain=1.20
countersteer_gain=2.0
; Predict approaching bank, seconds (0..0.15), capped to 12 degrees.
roll_lookahead=0.12
; Observe the player's actual high-G key chord; do not synthesize throttle inputs.
high_g_enabled=1
; Requested pitch-rate ceiling and response reference while the chord is held.
; Degrees/second, 54..140. This is NOT an edit to the aircraft flight model.
high_g_pitch_rate=110.0
; Hold the chosen turn side near the rear heading seam (0 disables).
rear_turn_hold=1
; Up to full pitch input for distant non-high-G dive targets; old braking kept.
dive_pitch_boost=1
; Experimental: extra yaw ONLY in large, aligned, near-level high-G turns.
; Enabled in this user preset; original pw.5 default is 0. F10 reloads.
high_g_yaw_boost=1
; Local fork: normal target-bank limit above is now effective.
allow_dive_inversion=1
dive_enter_pitch=-45.0
dive_enter_delta=25.0
dive_exit_pitch=-30.0
; 1: up to 20 Hz guidance diagnostics; 0: one sample per 10 seconds.
diagnostics=1
smoothing=0.12

; Legacy damping/dead-zone placeholders (not used by the rate controller).
roll_damping=0.008
pitch_damping=0.010
yaw_damping=0.30
dead_zone=1.25

; Flip one sign if that axis moves opposite to the target marker.
pitch_sign=1
roll_sign=-1
yaw_sign=-1

; Legacy FOV placeholders; live game camera FOV is used instead.
horizontal_fov=100.0
vertical_fov=62.0

; Build 25201480 input layout: slot 1 is yaw.
pitch_slot=0
roll_slot=2

; Keyboard names are case-insensitive. Restart GAME after editing this section.
; Flight pairs only detect manual takeover: bind the same keys in the GAME.
[keys]
pitch_keys=W,S
roll_keys=A,D
yaw_keys=Q,E
free_look=F
toggle_hud=F7
toggle_enabled=F8
recenter=F9
reload_config=F10
gaze_probe=F6
perf_report=F5
; Both keys must be held together. Match the game's accelerate/decelerate keys.
high_g_keys=CTRL,SPACE
